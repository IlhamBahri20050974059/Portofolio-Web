<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Color Picker 🎨</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 40px;
      background-color: #f0f0f0;
      transition: background-color 0.3s;
    }
    .picker-box {
      display: inline-block;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }
    input[type="color"] {
      width: 120px;
      height: 60px;
      border: none;
      cursor: pointer;
    }
    .color-code {
      margin-top: 15px;
      font-size: 20px;
      font-weight: bold;
    }
    .copy-btn {
      margin-top: 10px;
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #3498db;
      color: white;
      transition: background-color 0.2s;
    }
    .copy-btn:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>

  <div class="picker-box">
    <h2>🎨 Color Picker</h2>
    <input type="color" id="colorInput" value="#3498db" />
    <div class="color-code" id="colorCode">#3498db</div>
    <button class="copy-btn" onclick="copyColor()">Copy Code</button>
  </div>

  <script>
    const colorInput = document.getElementById('colorInput');
    const colorCode = document.getElementById('colorCode');

    colorInput.addEventListener('input', () => {
      const color = colorInput.value;
      document.body.style.backgroundColor = color;
      colorCode.textContent = color;
    });

    function copyColor() {
      const text = colorInput.value;
      navigator.clipboard.writeText(text).then(() => {
        const original = colorCode.textContent;
        colorCode.textContent = '✅ Copied!';
        setTimeout(() => colorCode.textContent = text, 1000);
      });
    }
  </script>

</body>
</html>
