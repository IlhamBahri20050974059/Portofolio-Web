<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        .converter {
            max-width: 400px;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin: auto;
        }
        select, input, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background: #28a745;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #218838;
        }
        .note {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="converter">
    <h2>💱 Currency Converter</h2>
    <input type="number" id="amount" placeholder="Masukkan jumlah" />
    <select id="fromCurrency"></select>
    <select id="toCurrency"></select>
    <button onclick="convertCurrency()">Convert</button>
    <h3 id="result"></h3>
    <p class="note">Website ini menggunakan Kurs yang diambil otomatis dari API secara</p>
</div>

<script>
    const currencies = {
      "AED":"United Arab Emirates Dirham","AFN":"Afghan Afghani","ALL":"Albanian Lek","AMD":"Armenian Dram",
      "ANG":"Netherlands Antillean Guilder","AOA":"Angolan Kwanza","ARS":"Argentine Peso","AUD":"Australian Dollar",
      "AWG":"Aruban Florin","AZN":"Azerbaijani Manat","BAM":"Bosnia-Herzegovina Convertible Mark","BBD":"Barbados Dollar",
      "BDT":"Bangladeshi Taka","BGN":"Bulgarian Lev","BHD":"Bahraini Dinar","BIF":"Burundian Franc",
      "BMD":"Bermudian Dollar","BND":"Brunei Dollar","BOB":"Boliviano","BRL":"Brazilian Real",
      "BSD":"Bahamian Dollar","BTN":"Bhutanese Ngultrum","BWP":"Botswana Pula","BYN":"Belarusian Ruble",
      "BZD":"Belize Dollar","CAD":"Canadian Dollar","CDF":"Congolese Franc","CHF":"Swiss Franc",
      "CLP":"Chilean Peso","CNY":"Chinese Yuan","COP":"Colombian Peso","CRC":"Costa Rican Colón",
      "CUP":"Cuban Peso","CVE":"Cabo Verde Escudo","CZK":"Czech Koruna","DJF":"Djiboutian Franc",
      "DKK":"Danish Krone","DOP":"Dominican Peso","DZD":"Algerian Dinar","EGP":"Egyptian Pound",
      "ERN":"Eritrean Nakfa","ETB":"Ethiopian Birr","EUR":"Euro","FJD":"Fijian Dollar",
      "FKP":"Falkland Islands Pound","GBP":"British Pound Sterling","GEL":"Georgian Lari","GGP":"Guernsey Pound",
      "GHS":"Ghanaian Cedi","GIP":"Gibraltar Pound","GMD":"Gambian Dalasi","GNF":"Guinean Franc",
      "GTQ":"Guatemalan Quetzal","GYD":"Guyanese Dollar","HKD":"Hong Kong Dollar","HNL":"Honduran Lempira",
      "HRK":"Croatian Kuna","HTG":"Haitian Gourde","HUF":"Hungarian Forint","IDR":"Indonesian Rupiah",
      "ILS":"Israeli New Shekel","IMP":"Isle of Man Pound","INR":"Indian Rupee","IQD":"Iraqi Dinar",
      "IRR":"Iranian Rial","ISK":"Icelandic Króna","JEP":"Jersey Pound","JMD":"Jamaican Dollar",
      "JOD":"Jordanian Dinar","JPY":"Japanese Yen","KES":"Kenyan Shilling","KGS":"Kyrgyzstani Som",
      "KHR":"Cambodian Riel","KID":"Kiribati Dollar","KMF":"Comorian Franc","KPW":"North Korean Won",
      "KRW":"South Korean Won","KWD":"Kuwaiti Dinar","KYD":"Cayman Islands Dollar","KZT":"Kazakhstani Tenge",
      "LAK":"Lao Kip","LBP":"Lebanese Pound","LKR":"Sri Lankan Rupee","LRD":"Liberian Dollar",
      "LSL":"Lesotho Loti","LYD":"Libyan Dinar","MAD":"Moroccan Dirham","MDL":"Moldovan Leu",
      "MGA":"Malagasy Ariary","MKD":"Macedonian Denar","MMK":"Myanmar Kyat","MNT":"Mongolian Tugrik",
      "MOP":"Macanese Pataca","MRU":"Mauritanian Ouguiya","MUR":"Mauritian Rupee","MVR":"Maldivian Rufiyaa",
      "MWK":"Malawian Kwacha","MXN":"Mexican Peso","MYR":"Malaysian Ringgit","MZN":"Mozambican Metical",
      "NAD":"Namibian Dollar","NGN":"Nigerian Naira","NIO":"Nicaraguan Córdoba","NOK":"Norwegian Krone",
      "NPR":"Nepalese Rupee","NZD":"New Zealand Dollar","OMR":"Omani Rial","PAB":"Panamanian Balboa",
      "PEN":"Peruvian Sol","PGK":"Papua New Guinean Kina","PHP":"Philippine Peso","PKR":"Pakistani Rupee",
      "PLN":"Polish Zloty","PRB":"Transnistrian Ruble","PYG":"Paraguayan Guarani","QAR":"Qatari Riyal",
      "RON":"Romanian Leu","RSD":"Serbian Dinar","RUB":"Russian Ruble","RWF":"Rwandan Franc",
      "SAR":"Saudi Riyal","SBD":"Solomon Islands Dollar","SCR":"Seychellois Rupee","SDG":"Sudanese Pound",
      "SEK":"Swedish Krona","SGD":"Singapore Dollar","SHP":"Saint Helena Pound","SLL":"Sierra Leonean Leone",
      "SOS":"Somali Shilling","SRD":"Surinamese Dollar","SSP":"South Sudanese Pound","STN":"São Tomé and Príncipe Dobra",
      "SYP":"Syrian Pound","SZL":"Swazi Lilangeni","THB":"Thai Baht","TJS":"Tajikistani Somoni",
      "TMT":"Turkmenistan Manat","TND":"Tunisian Dinar","TOP":"Tongan Paʻanga","TRY":"Turkish Lira",
      "TTD":"Trinidad and Tobago Dollar","TVD":"Tuvaluan Dollar","TWD":"New Taiwan Dollar","TZS":"Tanzanian Shilling",
      "UAH":"Ukrainian Hryvnia","UGX":"Ugandan Shilling","USD":"United States Dollar","UYU":"Uruguayan Peso",
      "UZS":"Uzbekistan Som","VES":"Venezuelan Bolívar","VND":"Vietnamese Dong","VUV":"Vanuatu Vatu",
      "WST":"Samoan Tala","XAF":"CFA Franc BEAC","XCD":"East Caribbean Dollar","XDR":"IMF Special Drawing Rights",
      "XOF":"CFA Franc BCEAO","XPF":"CFP Franc (XPF)","YER":"Yemeni Rial","ZAR":"South African Rand",
      "ZMW":"Zambian Kwacha","ZWL":"Zimbabwean Dollar"
    };

    const fromCurrency = document.getElementById("fromCurrency");
    const toCurrency = document.getElementById("toCurrency");
    let exchangeRates = {};

    const fallbackRates = {
        "USD": 1,
        "EUR": 0.92,
        "IDR": 15500,
        "JPY": 142,
        "GBP": 0.79,
        "AUD": 1.52,
        "CAD": 1.36
    };

    async function fetchRates() {
        try {
            const res = await fetch("https://api.exchangerate-api.com/v4/latest/USD");
            if (!res.ok) throw new Error("Fetch gagal");
            const data = await res.json();
            exchangeRates = data.rates;
        } catch (error) {
            console.warn("Gagal fetch API, gunakan fallback rates.");
            exchangeRates = fallbackRates;
        }
        populateCurrencyOptions();
    }

    function populateCurrencyOptions() {
        const codes = Object.keys(exchangeRates);
        codes.forEach(code => {
            let text = `${code} - ${currencies[code] || "Unknown Currency"}`;
            fromCurrency.add(new Option(text, code));
            toCurrency.add(new Option(text, code));
        });
        fromCurrency.value = "USD";
        toCurrency.value = "IDR";
    }

    function convertCurrency() {
        const amount = parseFloat(document.getElementById("amount").value);
        if (isNaN(amount)) {
            document.getElementById("result").innerText = "Masukkan jumlah yang valid";
            return;
        }
        const from = fromCurrency.value;
        const to = toCurrency.value;
        const converted = (amount / exchangeRates[from]) * exchangeRates[to];
        document.getElementById("result").innerText =
            `${amount} ${from} = ${converted.toFixed(2)} ${to}`;
    }

    fetchRates();
</script>
