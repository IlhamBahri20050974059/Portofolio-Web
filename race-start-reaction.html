<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Reaction Time - F1 Start</title>
  <style>
    body {
      text-align: center;
      font-family: sans-serif;
      background: #111;
      color: white;
      margin-top: 50px;
    }

    .lights {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 40px 0;
    }

    .light {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: #444;
      box-shadow: 0 0 10px #000;
      transition: background-color 0.3s ease;
    }

    .red { background-color: red; }
    .green { background-color: green; }

    button {
      padding: 10px 20px;
      font-size: 18px;
      margin-top: 30px;
      cursor: pointer;
    }

    .result {
      font-size: 24px;
      margin-top: 20px;
    }

    .jump {
      color: orange;
    }
  </style>
</head>
<body>

  <h1>Reaction Time Test - F1 Style</h1>

  <div class="lights">
    <div class="light" id="l1"></div>
    <div class="light" id="l2"></div>
    <div class="light" id="l3"></div>
    <div class="light" id="l4"></div>
    <div class="light" id="l5"></div>
  </div>

  <button id="startBtn">Start Test</button>
  <div class="result" id="result"></div>

  <script>
    let greenTime = 0;
    let testRunning = false;
    let clicked = false;

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function startTest() {
      document.getElementById("result").textContent = "";
      greenTime = 0;
      clicked = false;
      testRunning = true;

      const lights = [1, 2, 3, 4, 5].map(i => document.getElementById("l" + i));
      lights.forEach(l => l.className = "light");

      // Nyalakan lampu merah satu per satu
      for (let i = 0; i < lights.length; i++) {
        await sleep(600);
        lights[i].classList.add("red");
      }

      // Tunggu delay acak sebelum lampu hijau
      const delay = 1000 + Math.random() * 2000;
      await sleep(delay);

      lights.forEach(l => l.className = "light green");

      greenTime = performance.now();
    }

    // Tombol hanya memulai test, tidak dihitung klik reaksi
    document.getElementById("startBtn").addEventListener("click", () => {
      if (!testRunning) {
        startTest();
      }
    });

    // Klik di mana saja untuk reaksi
    document.body.addEventListener("click", (e) => {
      // Jangan hitung klik tombol
      if (e.target.id === "startBtn") return;

      if (!testRunning || clicked) return;

      const now = performance.now();

      if (greenTime === 0) {
        document.getElementById("result").innerHTML = "<span class='jump'>Jump Start! Too early.</span>";
        clicked = true;
        testRunning = false;
        return;
      }

      const reaction = now - greenTime;
      const seconds = (reaction / 1000).toFixed(3);
      document.getElementById("result").textContent = `Reaction Time: ${seconds} s`;

      clicked = true;
      testRunning = false;
    });
  </script>

</body>
</html>
